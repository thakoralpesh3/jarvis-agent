name: Run Jarvis Agent

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Command or Instruction for Jarvis'
        required: false
        default: 'Run self-diagnostics and report status'

jobs:
  run-jarvis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Jarvis Instruction
        run: |
          python main.py --prompt "${{ github.event.inputs.prompt }}" || true
