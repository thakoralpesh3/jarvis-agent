<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1a30"/>
      <stop offset="80%" stop-color="#040b17"/>
      <stop offset="100%" stop-color="#02050a"/>
    </radialGradient>
    <radialGradient id="glowCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0088ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0044aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="256" height="256" rx="54" fill="url(#bgGrad)"/>
  <rect width="252" height="252" x="2" y="2" rx="52" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Outer Tech Ring -->
  <circle cx="128" cy="128" r="96" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="14 8" stroke-opacity="0.7"/>
  <circle cx="128" cy="128" r="82" fill="none" stroke="#0088ff" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Segmented Arc Reactor Nodes -->
  <g stroke="#00f0ff" stroke-width="4" stroke-linecap="round" filter="url(#neonGlow)">
    <line x1="128" y1="36" x2="128" y2="52"/>
    <line x1="128" y1="204" x2="128" y2="220"/>
    <line x1="36" y1="128" x2="52" y2="128"/>
    <line x1="204" y1="128" x2="220" y2="128"/>
    <line x1="63" y1="63" x2="74" y2="74"/>
    <line x1="193" y1="63" x2="182" y2="74"/>
    <line x1="63" y1="193" x2="74" y2="182"/>
    <line x1="193" y1="193" x2="182" y2="182"/>
  </g>

  <!-- Middle Glowing Ring -->
  <circle cx="128" cy="128" r="62" fill="none" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlow)" stroke-opacity="0.85"/>
  <circle cx="128" cy="128" r="48" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 4" stroke-opacity="0.8"/>

  <!-- Inner Power Core -->
  <circle cx="128" cy="128" r="38" fill="url(#glowCore)"/>
  <circle cx="128" cy="128" r="18" fill="#ffffff" filter="url(#neonGlow)"/>

  <!-- Triangle Center Accent -->
  <polygon points="128,102 150,142 106,142" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#neonGlow)"/>
</svg>
